# FRESH 1000-STEP RUN (Kanishk 2026-05-30): clean comparison long-500 vs long-1000.
#
# Background: we tried to extend long-500 by resuming from step_500 (and from
# step_400). Both fail due to PyTorch SequentialLR + LinearLR semantics — the
# loaded scheduler state has milestones from the OLD max_steps=500 schedule,
# and the multiplicative LinearLR update can't recover lr after warmup-init
# pins opt.lr at 5e-13. Net result: any resume gets ~90 steps of dead training
# at lr≈0 then collapses. Patching prime-rl was the alternative; instead we
# pivot to a clean from-scratch run so the comparison is cleaner anyway.
#
# Byte-identical to ctrl0_u1_40_long_qwen3_4b.toml EXCEPT:
#   max_steps    500 -> 1000
#   output_dir   ..._long...  ->  ..._long1k...
#   wandb.name   ..._long  ->  ..._long1k
#
# LR schedule shape (warmup_steps=10, decay_steps=10) is unchanged from long-500
# for direct comparison. With max_steps=1000 the peak/constant phase is steps
# 10-990 (980 steps); decay tail is the last 10 steps.

max_steps = 1000
seq_len = 2048
output_dir = "/cache/runs/ctrl0_u1_40_long1k_qwen3_4b"

[ckpt]
interval = 100

[wandb]
project = "interoception"
entity = "singhh5050-stanford-university"
name = "ctrl0-qwen3-4b-u1-40-long1k"

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[trainer.model.lora]
rank = 32
alpha = 32.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.ckpt.weights]
save_adapter_separately = true

[trainer.optim]
type = "adamw"
lr = 5e-5
max_norm = 1.0
betas1 = 0.9
betas2 = 0.999
weight_decay = 0.01

[trainer.loss]
type = "default"
kl_tau = 1e-3

[trainer.scheduler]
type = "linear"
warmup_steps = 10
decay_steps = 10
min_lr = 0.0

[orchestrator]
batch_size = 64
rollouts_per_example = 8   # G=8 GRPO group size
seed = 0

[[orchestrator.filters]]
type = "gibberish"
[[orchestrator.filters]]
type = "repetition"
[[orchestrator.filters]]
type = "zero_advantage"
enforce = false

[orchestrator.train.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.train.env]]
id = "interoception-countdown"
name = "ctrl0-u1-40-long1k-qwen3-4b-train"
args = { problems_jsonl = "/root/data/train.jsonl", target_s_min = 1.0, target_s_max = 40.0, target_s_dist = "uniform", dataset_seed = 0, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "hyperbolic", attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true }

[orchestrator.eval]
interval = 50

[orchestrator.eval.sampling]
max_completion_tokens = 128
temperature = 1.0

[[orchestrator.eval.env]]
id = "interoception-countdown"
name = "ctrl0-u1-40-long1k-eval-uniform"
num_examples = 498
rollouts_per_example = 1
args = { problems_jsonl = "/root/data/eval.jsonl", target_s_min = 1.0, target_s_max = 40.0, target_s_dist = "uniform", dataset_seed = 777, timing_source = "sim", hardware = "A100_80GB", sim_model = "Qwen3-4B", max_turns = 16, reward_shape = "hyperbolic", attempt_bonus = 0.0, enforce_max_time = false, reward_time_term = true }

[inference]
enable_fp32_lm_head = true
